<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111C17">
  <title>Page not found · Smart Glucose Logger</title>
  <style>
    :root{color-scheme:dark;--pine:#111C17;--moss:#182720;--copper:#D49B54;--paper:#F2EFE9;--sage:#8FA398}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 70% 28%,#21352a 0%,var(--pine) 55%);color:var(--paper);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(720px,100%);padding:clamp(28px,7vw,64px);border:1px solid #D49B5477;border-radius:28px 8px 28px 8px;background:#182720cc;box-shadow:0 28px 90px #0006}
    .eyebrow{margin:0 0 16px;color:var(--copper);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font:clamp(3rem,10vw,6.5rem)/.95 Georgia,"Times New Roman",serif;letter-spacing:-.06em}
    .rule{width:100%;height:1px;margin:28px 0;background:linear-gradient(90deg,var(--copper),transparent)}
    p{max-width:500px;color:var(--sage)}
    a{display:inline-block;margin-top:20px;padding:11px 16px;border:1px solid var(--copper);border-radius:3px;color:var(--paper);text-decoration:none;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
    a:hover,a:focus-visible{background:var(--copper);color:var(--pine);outline:none}
    .mark{position:fixed;right:22px;bottom:16px;color:#D49B5488;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Smart Glucose Logger · Embedded Systems</p>
    <h1>Page not<br>found.</h1>
    <div class="rule"></div>
    <p>This address doesn’t point to a page in the project portfolio.</p>
    <a href="./">Return to the portfolio</a>
  </main>
  <span class="mark">404 / NOT FOUND</span>
</body>
</html>
